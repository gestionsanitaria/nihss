<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora NIHSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-root">
    <div class="loading-state">
      <div class="loading-state__card">
        <span class="loading-state__eyebrow">Escala NIHSS</span>
        <h1 class="loading-state__title">Preparando la calculadora</h1>
        <p class="loading-state__text">Cargando la estructura clínica y construyendo la evaluación.</p>
      </div>
    </div>
  </div>
  <div id="status-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <div class="noscript-card">
      <h1>JavaScript es necesario</h1>
      <p>Activa JavaScript para utilizar la calculadora NIHSS.</p>
    </div>
  </noscript>
  <script src="script.js"></script>
</body>
</html>
